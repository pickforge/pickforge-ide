# PR / main quality gate: Rust check + core tests, the TypeScript build, and
# visual regression. Complements release.yml (which only builds installers on a
# tag). Keep these green before merging.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git /github/workspace --redact --no-banner

  dependencies:
    name: dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test OSV report gate
        run: node --test tests/check-osv-severity.test.mjs
      - name: Scan all lockfiles
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            scan
            source
            --recursive
            --all-packages
            --format=json
            --output-file=/github/workspace/osv-results.json
            ./
      - name: Block unsafe advisories and verify lockfile coverage
        run: node scripts/check-osv-severity.mjs osv-results.json Cargo.lock bun.lock

  checks:
    name: cargo + tsc + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: installer smoke
        run: bun run test:installer

      - name: frontend lint
        run: bun run lint

      - name: unit tests
        run: bun run test:unit

      - name: frontend coverage
        run: bun run test:coverage

      - name: summarize frontend coverage
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const lcov = fs.readFileSync("coverage/lcov.info", "utf8");
          let found = 0;
          let hit = 0;
          for (const line of lcov.split("\n")) {
            if (line.startsWith("LF:")) found += Number(line.slice(3));
            if (line.startsWith("LH:")) hit += Number(line.slice(3));
          }
          const pct = found === 0 ? "0.00" : ((hit / found) * 100).toFixed(2);
          console.log(`## Coverage\n\nFrontend lines: ${pct}% (${hit}/${found})`);
          NODE

      - name: upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            coverage/lcov.info
            coverage/index.html
            coverage/
          retention-days: 7

      # Build the frontend FIRST so `dist/` exists (it is gitignored) before the
      # cargo steps compile the Tauri crate's generate_context!(), which embeds
      # `../dist`. --locked keeps Cargo.lock authoritative, mirroring the frozen
      # bun install.
      - name: build (tsc --noEmit && vite build)
        run: bun run build

      # Build + stage sidecars at the triple-suffixed paths `bundle.externalBin`
      # points at. `tauri-build` resolves those externalBin entries at
      # build-script time (not just at bundle time), so a bare `cargo check`
      # fails with "resource path ... doesn't exist" without them. The script
      # derives the host triple from `rustc -vV`, so it's correct for this runner.
      - name: stage sidecars (externalBin)
        run: bun run sidecar

      - name: device-free e2e smoke
        env:
          PICKFORGE_E2E_SERIAL: ""
          PICKFORGE_E2E_LAUNCH: ""
        run: bun run e2e

      - name: cargo check (workspace)
        run: cargo check --workspace --locked

      - name: cargo test (workspace)
        run: cargo test --workspace --locked --all-targets

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rust coverage
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --locked --all-targets --fail-under-lines 75 --html --output-dir target/llvm-cov/html
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --text --output-path target/llvm-cov/summary.txt

      - name: summarize Rust coverage
        run: |
          {
            echo
            echo "### Rust"
            cat target/llvm-cov/summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            target/llvm-cov/lcov.info
            target/llvm-cov/html/
            target/llvm-cov/summary.txt
          retention-days: 7

  windows-remote-auth:
    name: windows remote auth
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: remote auth tests
        run: cargo test -p pickforge-core --locked remote::auth

      - name: OMP Windows job cleanup
        run: cargo test -p pickforge-core --lib --locked agents::omp_acp::tests::windows_job_cleanup_kills_descendant_after_direct_parent_exits

      - name: Pi process isolation test
        run: cargo test -p pickforge-core --locked agents::pi_rpc::tests::windows_children_are_suspended_until_job_assignment_then_resumed

  macos-omp-acp:
    name: macOS OMP ACP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: OMP ACP Unix fixtures
        run: "cargo test -p pickforge-core --lib --locked agents::omp_acp::tests::"

  vrt:
    name: visual regression
    runs-on: ubuntu-22.04
    # BLOCKING GATE. The baselines under tests/vrt/screens.spec.ts-snapshots/ are
    # CI-canonical — regenerated by this same runner image via
    # .github/workflows/update-vrt-baselines.yml — so PR runs compare CI-rendered
    # screenshots against CI-rendered baselines. A real visual diff now fails the
    # job and blocks the merge; the tolerance in playwright.config.ts is only a
    # sub-pixel-AA safety margin. To refresh baselines after an intentional UI
    # change: `gh workflow run update-vrt-baselines.yml --ref <branch>`. Diff
    # artifacts are uploaded on failure.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run VRT (Playwright)
        run: bun run vrt

      - name: Upload VRT diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 7

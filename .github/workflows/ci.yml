name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter SDK
        run: fvm install
      - name: Install deps
        run: fvm flutter pub get
      - name: Codegen
        run: fvm dart run build_runner build --delete-conflicting-outputs
      - name: Assert no uncommitted codegen drift
        run: git diff --exit-code
      - name: Format check
        run: fvm dart format --set-exit-if-changed .
      - name: Analyze
        run: fvm flutter analyze
      - name: Test
        run: fvm flutter test --coverage --reporter=compact
      - name: Upload Flutter test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-failures-${{ matrix.os }}
          path: |
            test/**/failures/**
            failures/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Install Linux smoke dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake imagemagick libgtk-3-dev liblzma-dev ninja-build pkg-config xvfb
      - name: Linux desktop smoke
        if: matrix.os == 'ubuntu-latest'
        run: scripts/linux_smoke.sh
      - name: Upload Linux smoke artifacts
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke-${{ github.run_number }}
          path: build/smoke/linux/**
          if-no-files-found: ignore
          retention-days: 7

  desktop-build-smoke:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter SDK
        run: fvm install
      - name: Install deps
        run: fvm flutter pub get
      - name: Codegen
        run: fvm dart run build_runner build --delete-conflicting-outputs
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Desktop build smoke
        run: scripts/desktop_build_smoke.sh
        shell: bash
      - name: Native desktop launch smoke
        if: matrix.os != 'ubuntu-latest'
        run: scripts/desktop_launch_smoke.sh
        shell: bash
      - name: Upload desktop build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-build-failure-${{ matrix.os }}
          path: build/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload native desktop launch smoke artifacts
        if: always() && matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-launch-smoke-${{ matrix.os }}-${{ github.run_number }}
          path: build/smoke/desktop-launch/**
          if-no-files-found: ignore
          retention-days: 7

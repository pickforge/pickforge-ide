# PR / main quality gate: Rust check + core tests, the TypeScript build, and
# visual regression. Complements release.yml (which only builds installers on a
# tag). Keep these green before merging.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: cargo + tsc + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Build the frontend FIRST so `dist/` exists (it is gitignored) before the
      # cargo steps compile the Tauri crate's generate_context!(), which embeds
      # `../dist`. --locked keeps Cargo.lock authoritative, mirroring the frozen
      # bun install.
      - name: build (tsc --noEmit && vite build)
        run: bun run build

      # Build + stage the `pickforge-mcp` sidecar at the triple-suffixed path
      # `bundle.externalBin` points at. `tauri-build` resolves that externalBin
      # at build-script time (not just at bundle time), so a bare `cargo check`
      # fails with "resource path ... doesn't exist" without it. The script
      # derives the host triple from `rustc -vV`, so it's correct for this runner.
      - name: stage MCP sidecar (externalBin)
        run: bun run sidecar

      - name: cargo check (workspace)
        run: cargo check --workspace --locked

      - name: cargo test (core)
        run: cargo test -p pickforge-core --locked

  vrt:
    name: visual regression
    runs-on: ubuntu-22.04
    # BLOCKING GATE. The baselines under tests/vrt/screens.spec.ts-snapshots/ are
    # CI-canonical — regenerated by this same runner image via
    # .github/workflows/update-vrt-baselines.yml — so PR runs compare CI-rendered
    # screenshots against CI-rendered baselines. A real visual diff now fails the
    # job and blocks the merge; the tolerance in playwright.config.ts is only a
    # sub-pixel-AA safety margin. To refresh baselines after an intentional UI
    # change: `gh workflow run update-vrt-baselines.yml --ref <branch>`. Diff
    # artifacts are uploaded on failure.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run VRT (Playwright)
        run: bun run vrt

      - name: Upload VRT diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 7

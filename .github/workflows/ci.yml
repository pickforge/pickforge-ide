name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter SDK
        run: fvm install
      - name: Install deps
        run: fvm flutter pub get
      - name: Codegen
        run: fvm dart run build_runner build --delete-conflicting-outputs
      - name: Assert no uncommitted codegen drift
        run: git diff --exit-code
      - name: Format check
        run: fvm dart format --set-exit-if-changed .
      - name: Analyze
        run: fvm flutter analyze
      - name: Test
        run: fvm flutter test --coverage --reporter=compact
      - name: Upload Flutter test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-failures-${{ matrix.os }}
          path: |
            test/**/failures/**
            failures/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

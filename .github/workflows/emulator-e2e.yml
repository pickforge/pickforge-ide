name: Emulator E2E

on:
  workflow_dispatch:
    inputs:
      avd:
        description: Android Virtual Device name available on the runner
        required: true
        default: Pixel_10

permissions:
  contents: read

jobs:
  emulator-e2e:
    timeout-minutes: 30
    runs-on: [self-hosted, linux, android]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter SDK
        run: fvm install
      - name: Install deps
        run: fvm flutter pub get
      - name: Run emulator E2E
        run: scripts/emulator_e2e.sh "${{ inputs.avd }}"
      - name: Upload emulator E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-e2e-${{ inputs.avd }}-${{ github.run_number }}
          path: build/e2e/android/**
          if-no-files-found: ignore
          retention-days: 7

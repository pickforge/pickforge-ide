# CI release workflow for the PickForge Tauri app.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          # Updater signing — set these repo secrets (see docs/architecture/update-checks.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "PickForge ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. PickForge auto-updates from this release."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # linuxdeploy bundles the Ubuntu build host's libwayland into the AppImage,
  # which breaks EGL display creation on hosts with newer Mesa/Wayland (white
  # window, "EGL_BAD_PARAMETER"). libwayland must come from the host. The
  # tauri-action step above builds, signs, and uploads in one shot, so repair
  # the uploaded artifact afterwards: strip the libs, repack, re-sign, and
  # patch latest.json. See tauri-apps/tauri#11988.
  fix-linux-appimage:
    name: Strip bundled libwayland from AppImage
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Repair AppImage on the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No release found for $RELEASE_TAG; nothing to repair"
            exit 0
          fi
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern '*.AppImage' --pattern '*.AppImage.sig' --pattern latest.json
          shopt -s nullglob
          appimages=(release-assets/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage on the release, found ${#appimages[@]}" >&2
            exit 1
          fi
          appimage="${appimages[0]}"
          chmod +x "$appimage"
          workdir="$(mktemp -d)"
          offset="$("$appimage" --appimage-offset)"
          tail -c +"$((offset + 1))" "$appimage" >"$workdir/payload.squashfs"
          unsquashfs -q -d "$workdir/AppDir" "$workdir/payload.squashfs"
          libs=("$workdir"/AppDir/usr/lib/libwayland-*.so*)
          if [[ ${#libs[@]} -eq 0 ]]; then
            echo "$appimage: no bundled libwayland, nothing to repair"
            exit 0
          fi
          printf "%s: removing %s\n" "$appimage" "${libs[*]##*/}"
          rm -- "${libs[@]}"
          comp="$(unsquashfs -s "$workdir/payload.squashfs" | awk '/^Compression/ {print $2}')"
          head -c "$offset" "$appimage" >"$workdir/runtime"
          mksquashfs "$workdir/AppDir" "$workdir/repacked.squashfs" \
            -quiet -root-owned -noappend -comp "${comp:-zstd}" -b 131072
          if unsquashfs -l "$workdir/repacked.squashfs" | grep -q libwayland-; then
            echo "$appimage: libwayland still present after repack" >&2
            exit 1
          fi
          cat "$workdir/runtime" "$workdir/repacked.squashfs" >"$appimage"
          chmod +x "$appimage"
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            rm -f "$appimage.sig"
            bun run tauri signer sign "$appimage"
            test -s "$appimage.sig"
            if [[ -f release-assets/latest.json ]]; then
              jq --arg sig "$(cat "$appimage.sig")" --arg name "$(basename "$appimage")" \
                '.platforms |= with_entries(
                   if (.value.url | endswith("/" + $name))
                   then .value.signature = $sig
                   else . end)' \
                release-assets/latest.json >"$workdir/latest.json"
              mv "$workdir/latest.json" release-assets/latest.json
            fi
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

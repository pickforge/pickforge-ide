name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: pickforge-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match src-tauri/tauri.conf.json version $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          release_notes="Download the installer for your platform below. PickForge auto-updates from this release."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; reusing it."
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "PickForge v${version}" \
              --notes "$release_notes" \
              --generate-notes
          fi

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: create-release
    if: always() && needs.create-release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            target: ""
          - name: macos-aarch64
            os: macos-latest
            bundles: ""
            target: ""
          - name: windows
            os: windows-latest
            bundles: ""
            target: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            squashfs-tools \
            wget

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate release config
        run: bun run pickforge-tauri-release validate-config

      - name: Build Tauri bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          build_args=()
          if [[ -n "${{ matrix.bundles }}" ]]; then
            build_args+=(--bundles "${{ matrix.bundles }}")
          fi
          if [[ -n "${{ matrix.target }}" ]]; then
            build_args+=(--target "${{ matrix.target }}")
          fi

          bun run tauri build "${build_args[@]}"

      - name: Fix Linux AppImage
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          bun run pickforge-tauri-release fix-appimage --appimage "${appimages[0]}"

      - name: Upload debug symbols to Sentry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pickforge
          SENTRY_PROJECT: pickforge
        run: |
          if [[ -z "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping"
            exit 0
          fi

          version="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          release="pickforge@${version}"
          sentry_cli=(npx --yes @sentry/cli@2)

          if ! "${sentry_cli[@]}" debug-files upload --include-sources target; then
            echo "::warning::Sentry debug-files upload failed"
          fi

          if ! "${sentry_cli[@]}" sourcemaps upload --release "$release" dist; then
            echo "::warning::Sentry sourcemaps upload failed"
          fi

      - name: Collect release assets
        run: bun run pickforge-tauri-release collect-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pickforge-${{ matrix.name }}-${{ github.run_number }}
          path: release-assets/

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  finalize-release:
    name: Finalize draft release
    runs-on: ubuntu-24.04
    needs:
      - create-release
      - build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          download_base="https://github.com/pickforge/pickforge/releases/download/${RELEASE_TAG}"

          rm -rf release-assets latest.json
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*' --clobber

          bun run pickforge-tauri-release generate-latest-json \
            --assets-dir release-assets \
            --version "$version" \
            --download-base-url "$download_base" \
            --out latest.json
          bun run pickforge-tauri-release verify-latest-json --input latest.json

          gh release upload "$RELEASE_TAG" latest.json --clobber

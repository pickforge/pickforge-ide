name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter SDK
        run: fvm install
      - name: Install deps
        run: fvm flutter pub get
      - name: Codegen
        run: fvm dart run build_runner build --delete-conflicting-outputs
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl file imagemagick libgtk-3-dev liblzma-dev ninja-build pkg-config xdotool xvfb
      - name: Build desktop
        run: |
          case "${{ matrix.os }}" in
            ubuntu-24.04)   fvm flutter build linux   --release ;;
            macos-latest)   fvm flutter build macos   --release ;;
            windows-latest) fvm flutter build windows --release ;;
          esac
        shell: bash
      - name: Native desktop launch smoke
        if: matrix.os != 'ubuntu-24.04'
        env:
          PICKFORGE_DESKTOP_BUILD_MODE: release
        run: scripts/desktop_launch_smoke.sh
        shell: bash
      - name: Package Linux .deb
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/package_linux_deb.sh --skip-build
      - name: Smoke Linux .deb
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/linux_deb_smoke.sh --skip-build
      - name: Smoke Linux .deb clean container install
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/linux_deb_container_install_smoke.sh --skip-build
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/package_linux_appimage.sh --skip-build
      - name: Smoke Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/linux_appimage_smoke.sh --skip-build
      - name: Sign Linux .deb
        if: matrix.os == 'ubuntu-24.04'
        env:
          PICKFORGE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.PICKFORGE_GPG_PRIVATE_KEY_BASE64 }}
          PICKFORGE_GPG_PASSPHRASE: ${{ secrets.PICKFORGE_GPG_PASSPHRASE }}
          PICKFORGE_GPG_KEY: ${{ secrets.PICKFORGE_GPG_KEY }}
        run: |
          if [[ -z "${PICKFORGE_GPG_PRIVATE_KEY_BASE64:-}" ]]; then
            echo "No Linux signing key configured; leaving .deb unsigned."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$PICKFORGE_GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
          scripts/sign_linux_deb.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pickforge-${{ matrix.os }}
          path: build/

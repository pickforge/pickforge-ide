name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Install FVM
        run: dart pub global activate fvm
      - name: Install Flutter SDK
        run: fvm install
      - name: Install deps
        run: fvm flutter pub get
      - name: Codegen
        run: fvm dart run build_runner build --delete-conflicting-outputs
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config
      - name: Build desktop
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  fvm flutter build linux   --release ;;
            macos-latest)   fvm flutter build macos   --release ;;
            windows-latest) fvm flutter build windows --release ;;
          esac
        shell: bash
      - name: Package Linux .deb
        if: matrix.os == 'ubuntu-latest'
        run: scripts/package_linux_deb.sh --skip-build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pickforge-${{ matrix.os }}
          path: build/

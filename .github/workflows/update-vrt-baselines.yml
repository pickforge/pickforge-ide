# Regenerate the VRT baselines on the CI runner so they're CI-canonical.
#
# Why this exists: the committed snapshots under
# `tests/vrt/screens.spec.ts-snapshots/` are pixel-compared in the `visual
# regression` job of ci.yml. If they were rendered on a developer's machine,
# CI chromium's font anti-aliasing differs by a few percent on text-heavy
# screens and the job fails on every PR. The fix is to make CI the single
# renderer of record: run this workflow once (and after any intentional UI
# change) to regenerate the baselines on the SAME runner image the ci.yml vrt
# job uses, then commit them back. PR runs then diff CI-rendered pixels against
# CI-rendered pixels and pass.
#
# Manual-only (workflow_dispatch). It never runs on push/PR.
name: update-vrt-baselines

on:
  workflow_dispatch:

# Needs write access to push the regenerated PNGs back to the branch, and
# actions: write to dispatch the ci workflow afterwards (#349) — a push made
# with the default GITHUB_TOKEN never triggers pull_request/push workflows
# (GitHub's recursion guard), which previously left the PR at "no checks
# reported" on the new HEAD until someone hand-pushed an empty commit. The
# guard exempts workflow_dispatch, so the default token can re-run the gate.
permissions:
  contents: write
  actions: write

jobs:
  update-baselines:
    name: regenerate VRT baselines (CI-canonical)
    # MUST match the runner image + Playwright install of the ci.yml `vrt` job
    # so the rendered pixels are identical to what PR runs compare against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the dispatched ref so the commit lands on the right branch.
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Delete the existing baselines first. `--update-snapshots` only rewrites
      # PNGs that are missing or mismatch beyond tolerance, so snapshots that
      # drift *within* tolerance would otherwise survive as stale local-rendered
      # pixels — defeating "make CI canonical". Removing them forces every
      # baseline to be regenerated fresh on this runner.
      - name: Clear stale baselines
        run: rm -rf tests/vrt/*-snapshots

      # `--update-snapshots` writes a complete set of baseline PNGs from this
      # runner's chromium (all missing after the clear above). The webServer
      # (vite + VITE_PICKFORGE_VRT) is started by playwright.config.ts exactly
      # as in the gating job.
      - name: Regenerate VRT baselines (Playwright --update-snapshots)
        run: bun run vrt -- --update-snapshots

      - name: Commit regenerated baselines
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/vrt
          if git diff --cached --quiet; then
            echo "Baselines already CI-canonical — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test(vrt): regenerate CI-canonical baselines"
          git push origin HEAD:${{ github.ref_name }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The push above used GITHUB_TOKEN, so it created no pull_request/push
      # runs — the branch's PR would sit at "no checks reported" forever.
      # Re-run the gate explicitly on the updated branch (#349).
      - name: Dispatch ci on the updated branch
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"

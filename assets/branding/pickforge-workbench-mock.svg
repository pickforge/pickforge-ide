<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-label="PickForge workbench mock">
  <title>PICKFORGE · WORKBENCH</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="720" rx="14"/></clipPath>
  </defs>

  <!-- window frame -->
  <rect width="1200" height="720" rx="14" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="13.5" stroke="#F2F2F3" stroke-opacity="0.14"/>

  <g clip-path="url(#frame)">
    <!-- chrome -->
    <circle cx="28" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <circle cx="46" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <circle cx="64" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <text x="92" y="28" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#6E6E75">PICKFORGE · WORKBENCH</text>
    <g>
      <rect x="1008" y="12" width="168" height="24" rx="12" fill="#FF7A1A" fill-opacity="0.05" stroke="#FF7A1A" stroke-opacity="0.3"/>
      <circle cx="1024" cy="24" r="3" fill="#FF7A1A"/>
      <text x="1034" y="28" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#FF7A1A">WIDGET PICKED</text>
    </g>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#F2F2F3" stroke-opacity="0.08"/>

    <!-- ===== emulator pane ===== -->
    <rect x="24" y="72" width="400" height="360" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="44" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">EMULATOR · ANDROID</text>
    <text x="404" y="100" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75" fill-opacity="0.7">VM SERVICE CONNECTED</text>
    <!-- phone -->
    <rect x="144" y="114" width="160" height="292" rx="16" fill="#0A0A0B" stroke="#F2F2F3" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="156" y="130" width="136" height="260" rx="6" fill="#141417"/>
    <!-- app bar -->
    <rect x="164" y="140" width="120" height="22" rx="4" fill="#F2F2F3" fill-opacity="0.07"/>
    <!-- body rows -->
    <rect x="164" y="172" width="120" height="10" rx="3" fill="#F2F2F3" fill-opacity="0.16"/>
    <rect x="164" y="190" width="98" height="8" rx="3" fill="#F2F2F3" fill-opacity="0.08"/>
    <rect x="164" y="204" width="108" height="8" rx="3" fill="#F2F2F3" fill-opacity="0.08"/>
    <!-- picked widget: button with ember selection bracket -->
    <rect x="176" y="238" width="96" height="34" rx="8" fill="#F2F2F3" fill-opacity="0.08" stroke="#F2F2F3" stroke-opacity="0.14"/>
    <rect x="196" y="252" width="56" height="7" rx="3" fill="#F2F2F3" fill-opacity="0.25"/>
    <g stroke="#FF7A1A" stroke-width="2" stroke-linecap="square" fill="none">
      <path d="M168 242 V230 H180"/>
      <path d="M168 268 V280 H180"/>
      <path d="M268 230 H280 V242"/>
      <path d="M268 280 H280 V268"/>
    </g>
    <!-- more rows -->
    <rect x="164" y="296" width="112" height="8" rx="3" fill="#F2F2F3" fill-opacity="0.08"/>
    <rect x="164" y="312" width="90" height="8" rx="3" fill="#F2F2F3" fill-opacity="0.08"/>
    <rect x="208" y="376" width="32" height="4" rx="2" fill="#F2F2F3" fill-opacity="0.2"/>
    <text x="224" y="424" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E75" fill-opacity="0.7">picked · ElevatedButton</text>

    <!-- ===== widget context pane ===== -->
    <rect x="448" y="72" width="360" height="360" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="468" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">WIDGET CONTEXT</text>

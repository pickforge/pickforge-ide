name: pickforge
description: "Pickforge — widget-level AI context for Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  animations: ^2.2.0
  bloc: ^9.2.0

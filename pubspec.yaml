name: pickforge
description: "Pickforge — widget-level AI context for Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state + architecture
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^17.2.2

  # models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # storage
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # vm service / inspector
  uuid: ^4.5.3
  vm_service: ^15.1.0
  web_socket_channel: ^3.0.3

  # desktop window
  window_manager: ^0.5.1

  # misc
  yaml: ^3.1.3
  dio: ^5.9.2
  intl: ^0.20.2

  # design & motion
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  rive: ^0.14.5

  # icons
  lucide_icons_flutter: ^3.1.13
  hugeicons: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.0

  build_runner: ^2.14.0
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  injectable_generator: ^3.0.2
  drift_dev: ^2.32.1
  intl_utils: ^2.8.14

  mocktail: ^1.0.5
  bloc_test: ^10.0.0

  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/skills/
    - assets/agents/
    - assets/animations/

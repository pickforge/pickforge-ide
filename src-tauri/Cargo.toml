[package]
name = "pickforge-tauri"
description = "PickForge — Tauri shell (Rust core + SolidJS UI)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "pickforge_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
sentry = "0.42"
tauri-plugin-sentry = "0.5"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "6"
tokio = { workspace = true }
pickforge-core = { path = "../crates/pickforge-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux/Wayland app_id: GTK derives xdg_toplevel.set_app_id from g_get_prgname(),
# which defaults to the binary name ("pickforge-tauri"). run() forces it to the
# bundle identifier early via gtk::glib::set_prgname so the window matches the
# installed dev.pickforge.app.desktop + icon. gtk 0.18 is already in the build
# graph (tao -> gtk), so this pins, but doesn't add, a crate.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSNotification",
    "NSString",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tauri-plugin-updater = "2"
